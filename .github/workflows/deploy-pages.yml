name: Build and deploy web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pygbag
        run: python -m pip install pygbag

      - name: Build web app
        run: python -m pygbag --build .

      - name: Hide Pygbag startup messages
        run: |
          python -c "from pathlib import Path; p=Path('build/web/index.html'); s=p.read_text(encoding='utf-8'); assert '</head>' in s; p.write_text(s.replace('</head>', '<style>#infobox{display:none!important}body{background:#100d12!important}</style></head>', 1), encoding='utf-8')"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
